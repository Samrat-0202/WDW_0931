<!DOCTYPE html>
<html>
<head>
    <title>Hotel Room Booking Form</title>
</head>

<body>

<center>

<table border="2" cellpadding="20">
    <tr>
        <td align="center">

            <h1>Hotel Room Booking Form</h1>

            <form action="#" method="post">
                <fieldset>
                    <legend><b>Personal Information</b></legend>

               <label for="fullname">Fullname:</label>  
                <input type="text" id="fullname" name="fullname" required>
                <br><br>
                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other" required>
                <label for="other">Other</label>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
                <br><br>
                </fieldset>

                <fieldset>
                    <legend><b>Booking Information</b></legend>

                    <label for="checkin">Check-in Date:</label>
                    <input type="date" id="checkin" name="checkin" required>
                    <br><br>

                <label for="checkout">Check-out Date:</label>
                <input type="date" id="checkout" name="checkout" required>
                <br><br>

             <label for="room">Room Type:</label>
                <select id="room" name="room">
                    <option value="single">Single Room</option>
                    <option value="double">Double Room</option>
                    <option value="deluxe">Deluxe Room</option>
                </select>
                <br><br>

               <label for="guests"> Number of Guests:</label>
                <input type="number" id="guests" name="guests" min="1" max="10" style="width: 65px;">
                <br><br></fieldset>
                <fieldset>
                    <legend><b>Additional Requests</b></legend>

                <label for="requests">Special Requests:</label>
                <br>

                <textarea  id= "requests" name="requests" rows="5" cols="45"></textarea>
                <br><br></fieldset>

                <input type="submit" value="Book Now">
                <input type="reset" value="Reset Form">

            </form>

        </td>
    </tr>
</table>

</center>

</body>
</html>
